name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name to release (e.g. v0.2.0)"
        required: false
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ───────────────────────────────────────────────
  # Gate: CI checks must pass before publishing
  # ───────────────────────────────────────────────
  ci:
    name: CI Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --lib --bins -- -D warnings

      - name: Tests
        run: cargo test --workspace --lib

  # ───────────────────────────────────────────────
  # Publish acl to crates.io
  # ───────────────────────────────────────────────
  publish-crate:
    name: Publish to crates.io
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          if curl -fsSL "https://crates.io/api/v1/crates/a3s-acl/${VERSION}" >/dev/null 2>&1; then
            echo "a3s-acl ${VERSION} already exists on crates.io, skipping publish."
            exit 0
          fi
          set +e
          OUTPUT=$(cargo publish --allow-dirty 2>&1)
          STATUS=$?
          set -e
          echo "$OUTPUT"
          if [ "$STATUS" -ne 0 ]; then
            if echo "$OUTPUT" | grep -Eqi "already (uploaded|exists)"; then
              echo "a3s-acl ${VERSION} was already published, treating as success."
              exit 0
            fi
            exit "$STATUS"
          fi

  # ───────────────────────────────────────────────
  # Publish Node SDK to npm
  # ───────────────────────────────────────────────
  publish-node:
    name: Publish Node SDK to npm
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        working-directory: sdk/node
        run: npm install

      - name: TypeScript check
        working-directory: sdk/node
        run: npx tsc --noEmit

      - name: Publish to npm
        working-directory: sdk/node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"

          redact() {
            sed -E \
              -e 's/npm_[A-Za-z0-9]+/[redacted]/g' \
              -e 's/(token[=:][[:space:]]*)[^[:space:]]+/\1[redacted]/gi' \
              -e 's/(authorization[=:][[:space:]]*Bearer[[:space:]]+)[^[:space:]]+/\1[redacted]/gi'
          }

          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NODE_AUTH_TOKEN is unset. Configure repository secret NPM_TOKEN with publish rights for ${NAME} (or enable npm trusted publishing for this workflow)."
            exit 1
          fi

          set +e
          WHOAMI_OUTPUT="$(npm whoami --registry https://registry.npmjs.org 2>&1)"
          WHOAMI_STATUS=$?
          set -e
          if [ "$WHOAMI_STATUS" -ne 0 ]; then
            echo "::error::npm authentication failed before publishing ${NAME}@${VERSION}. Verify NPM_TOKEN is valid and can access the @a3s-lab scope."
            printf '%s\n' "$WHOAMI_OUTPUT" | redact
            exit "$WHOAMI_STATUS"
          fi
          echo "Authenticated to npm as: ${WHOAMI_OUTPUT}"

          set +e
          ACCESS_OUTPUT="$(npm access list packages 2>&1)"
          ACCESS_STATUS=$?
          set -e
          if [ "$ACCESS_STATUS" -ne 0 ]; then
            echo "::error::Unable to list npm packages for the authenticated identity. The token may lack org/package authorization for ${NAME}."
            printf '%s\n' "$ACCESS_OUTPUT" | redact
            exit "$ACCESS_STATUS"
          fi
          if ! printf '%s\n' "$ACCESS_OUTPUT" | grep -F "$NAME" >/dev/null 2>&1; then
            echo "::error::Authenticated npm identity cannot see ${NAME}. Grant publish access on the @a3s-lab scope/package, or create the package with an owner token before retrying."
            echo "Visible packages (redacted listing):"
            printf '%s\n' "$ACCESS_OUTPUT" | redact | head -50
            exit 1
          fi
          echo "Preflight confirmed package visibility for ${NAME}."

          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "${NAME}@${VERSION} already exists on npm, skipping."
            exit 0
          fi

          set +e
          OUTPUT="$(npm publish --access public 2>&1)"
          STATUS=$?
          set -e
          printf '%s\n' "$OUTPUT" | redact

          if [ "$STATUS" -ne 0 ]; then
            if echo "$OUTPUT" | grep -Eqi "previously published|cannot publish over|already exists"; then
              echo "${NAME}@${VERSION} was already published, treating as success."
              exit 0
            fi
            if echo "$OUTPUT" | grep -Eqi "E404|not authorized|need auth|403|ENEEDAUTH"; then
              echo "::error::npm rejected publish of ${NAME}@${VERSION}. This is usually missing @a3s-lab scope/package publish authorization rather than a package build failure."
            fi
            exit "$STATUS"
          fi

  # ───────────────────────────────────────────────
  # Create GitHub Release
  # ───────────────────────────────────────────────
  github-release:
    name: GitHub Release
    needs: [publish-crate, publish-node]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | grep '^v' | head -2 | tail -1)
          if [ -z "$PREV_TAG" ]; then
            echo "Initial release" > /tmp/release-notes.md
          else
            git log "${PREV_TAG}..HEAD" --oneline --no-merges --pretty=format:"- %s" | head -50 > /tmp/release-notes.md
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.tag_name || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" &>/dev/null; then
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes-file /tmp/release-notes.md
          else
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes-file /tmp/release-notes.md
          fi
